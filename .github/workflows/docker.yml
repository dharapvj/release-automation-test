name: Docker Build and Push

on:
  push:
    branches: [main, master]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.event.repository.fork == false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  retag-release:
    name: Retag SHA Image with Release Version
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.repository.fork == false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve tag name
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          # target_commitish may be a branch name (e.g. "main") rather than a SHA.
          # The GitHub API resolves both correctly.
          SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.release.target_commitish }}" --jq '.sha')
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Retag SHA image with release version
        run: |
          SHA_SHORT=$(echo "${{ steps.resolve.outputs.sha }}" | cut -c1-7)
          SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHA_SHORT}"
          TARGET="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.version }}"
          TARGET_LOWER="${TARGET,,}"
          SOURCE_LOWER="${SOURCE,,}"
          echo "Retagging ${SOURCE_LOWER} → ${TARGET_LOWER}"
          docker buildx imagetools create --tag "${TARGET_LOWER}" "${SOURCE_LOWER}"


